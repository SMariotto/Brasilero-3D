<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brasilero 3D: telão</title>
    <meta name="theme-color" content="#0a2113" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icones/icone-192.png" />
    <link rel="apple-touch-icon" href="/icones/icone-180.png" />
    <script type="module" src="/src/tela/main.ts"></script>
  </head>
  <body class="tela">
    <section id="inicio" class="cena">
      <h1 class="logo">Brasilero <span>3D</span></h1>
      <p class="sub">Futebol para jogar com os amigos. O celular é o controle.</p>
      <button id="criar" class="grande" type="button">Criar sala</button>
      <form id="form-assistir" class="assistir" autocomplete="off">
        <input id="codigo" maxlength="4" placeholder="ABCD" aria-label="Código da sala" spellcheck="false" autocapitalize="characters" />
        <button class="medio" type="submit">Assistir uma sala</button>
      </form>
      <p id="aviso-inicio" class="aviso" role="alert"></p>
      <p id="servidor-lembrado" class="servidor-lembrado" hidden>
        Servidor: <span id="servidor-texto"></span>
        <button id="esquecer-servidor" class="medio" type="button">Voltar ao padrão</button>
      </p>
    </section>

    <section id="lobby" class="cena" hidden></section>

    <section id="vitrine" class="cena vitrine" hidden></section>

    <section id="jogo" class="cena" hidden>
      <div id="canvas-host"></div>
      <div id="hud"></div>
    </section>

    <div id="carregando" class="faixa" hidden>Conectando...</div>
    <div id="reconectando" class="faixa" hidden>Reconectando...</div>
    <div id="ping" class="ping" hidden></div>
    <div id="tabela" class="tabela" hidden></div>
    <button id="botao-tabela" class="botao-tabela" type="button" hidden title="Tabela do campeonato da sala (tecla T)">Tabela (T)</button>
    <button id="botao-som" class="botao-som" type="button" hidden title="Ligar ou desligar o som (tecla M)"></button>
  </body>
</html>
